name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig build test
        run: zig build test --summary all
      - name: zig build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
      - name: e2e
        run: bash tests/e2e.sh
      # Guards the authorization gate. Depends on nothing outside the repo:
      # it pins SECRETCTL_FORCE_LOCKED on both sides, installs no keychain
      # protector, and reaches no network beyond a refused localhost port.
      - name: e2e (lock state)
        run: bash tests/e2e_lockstate.sh
      - name: e2e (sync)
        run: bash tests/e2e_sync.sh
      # Checks that every factual claim in `secretctl skill` is true. A skill
      # file is read by something that acts on it, so a stale claim is worse
      # than a missing one. No keychain items, no network.
      - name: e2e (skill)
        run: bash tests/e2e_skill.sh
      # The three version strings must agree. This is what the old `nix build`
      # job incidentally covered — and the only part of it worth keeping, since
      # nothing consumes the nix package. Costs a second instead of five
      # minutes, and catches a mismatch, which `nix build` never did.
      # Guards a destructive command that already destroyed the real vault's
      # keychain item once during this project's testing. No keychain writes:
      # the refusal happens before enumeration.
      - name: e2e (prune guard)
        run: bash tests/e2e_prune_guard.sh
      - name: version strings agree
        run: bash tests/version_consistency.sh
